appId: local.voice.manager
productName: Crew
asar: false
directories:
  output: dist/desktop
  buildResources: build
files:
  - runtime/**
  - package.json
  - build/crew-mark.png
  - config/*.example.json
  - prompts/**
  - docs/**
  - README.md
  - '!**/.DS_Store'
  - '!**/*.log'
artifactName: '${productName}-${version}-${arch}.${ext}'
npmRebuild: false
# electron-builder includes only production dependency closure automatically.
forceCodeSigning: true
publish:
  provider: github
  owner: MattGibney
  repo: crew
  private: false
  channel: latest
  releaseType: draft
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  minimumSystemVersion: '13.0'
  extendInfo:
    NSMicrophoneUsageDescription: 'Crew uses your microphone for voice conversations you explicitly start. You can approve access during setup without starting a call.'
    NSLocalNetworkUsageDescription: 'Crew connects its window to its local controller on this Mac and uses WebRTC for voice when you start a call.'
dmg:
  sign: true
  contents:
    - x: 150
      y: 180
    - x: 450
      y: 180
      type: link
      path: /Applications
